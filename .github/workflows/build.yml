name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '预发布版本号，例如 3.0.0-beta.1'
        required: true
      prerelease:
        description: '是否发布为 GitHub Pre-release'
        type: boolean
        default: true
      publish_release:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS x64 (Intel, available until Aug 2027)
          - os: macos-15-intel
            arch: x64
            build_cmd: pnpm run build:mac:x64
          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            arch: arm64
            build_cmd: pnpm run build:mac:arm64
          # Windows x64
          - os: windows-latest
            arch: x64
            build_cmd: pnpm run build:win

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            prerelease="${INPUT_PRERELEASE:-true}"
          else
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *-*) prerelease="true" ;;
              *) prerelease="false" ;;
            esac
          fi

          if [ -z "$version" ]; then
            echo "Release version is required" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$([ "$prerelease" = "true" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.33.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install plugin dependencies
        working-directory: internal-plugins/setting
        # 设置插件使用独立锁文件，避免根 workspace 将安装重定向到主项目。
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 统一构建命令
      - name: Build and Package
        # macOS 产物不再签名或公证，显式关闭证书自动发现，避免在 runner 上匹配到无关证书。
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.build_cmd }}

      # 上传平台产物（只上传指定文件类型）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            prerelease="${INPUT_PRERELEASE:-true}"
          else
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *-*) prerelease="true" ;;
              *) prerelease="false" ;;
            esac
          fi

          if [ -z "$version" ]; then
            echo "Release version is required" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$([ "$prerelease" = "true" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-macos-15-intel-x64
          path: dist/mac-x64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-macos-14-arm64
          path: dist/mac-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-windows-latest-x64
          path: dist/windows

      # 合并 macOS 双架构元数据，并规范化 Windows 与 macOS 的更新清单。
      - name: Generate update info
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          WINDOWS_UPDATE_METADATA: dist/windows/latest.yml
          MAC_X64_UPDATE_METADATA: dist/mac-x64/latest-mac.yml
          MAC_ARM64_UPDATE_METADATA: dist/mac-arm64/latest-mac.yml
          UPDATE_METADATA_OUTPUT_DIR: dist/release
          REQUIRE_UPDATE_METADATA: 'true'
        run: pnpm updater

      # macOS 产物已取消签名与公证，在发布说明末尾补充统一提示，避免用户误判产物损坏。
      - name: Append macOS unsigned notice to release notes
        shell: bash
        run: |
          cat >> changelog.md <<'EOF'

          > [!IMPORTANT]
          > 本版本 macOS 产物（dmg / zip）未进行代码签名与公证。首次打开若提示“无法验证开发者”或“已损坏”，可在“系统设置 → 隐私与安全性”中点击“仍要打开”，或执行 `xattr -dr com.apple.quarantine /Applications/ZTools.app` 后再打开。
          > 若仍无法启动，可执行 `codesign --force --deep --sign - /Applications/ZTools.app` 做本地临时签名。
          EOF

      # 上传安装包、标准完整更新包、blockmap 和最终元数据。
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.tag }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
          body_path: changelog.md
          files: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.blockmap
            dist/mac-x64/*.dmg
            dist/mac-x64/*.zip
            dist/mac-x64/*.blockmap
            dist/mac-arm64/*.dmg
            dist/mac-arm64/*.zip
            dist/mac-arm64/*.blockmap
            dist/release/*.yml
